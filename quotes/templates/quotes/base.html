<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quotes</title><style>body{font:16px Arial;max-width:1050px;margin:30px auto;padding:0 16px;color:#333}a{color:#1769aa;text-decoration:none}header{display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:16px}main{display:grid;grid-template-columns:3fr 1fr;gap:28px}.quote{border-bottom:1px solid #ddd;padding:16px 0}.tags a{background:#eee;padding:4px 7px;margin:3px;display:inline-block;border-radius:4px}.muted{color:#777}input,textarea,select{display:block;padding:8px;margin:6px 0 14px;max-width:100%;width:400px}button{padding:8px 14px;cursor:pointer}.messages{color:#176b35}@media(max-width:700px){main{display:block}}</style></head><body><header><a href="{% url 'home' %}"><b>Quotes to Scrape</b></a>{% if user.is_authenticated %}<a href="{% url 'add_author' %}">Додати автора</a><a href="{% url 'add_quote' %}">Додати цитату</a><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button>Вийти ({{user.username}})</button></form>{% else %}<a href="{% url 'login' %}">Увійти</a><a href="{% url 'register' %}">Реєстрація</a>{% endif %}</header>{% for message in messages %}<p class="messages">{{message}}</p>{% endfor %}{% block content %}{% endblock %}</body></html>
